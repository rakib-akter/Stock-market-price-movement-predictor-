name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what the offline test suite needs (no heavy optional deps).
          pip install numpy pandas scikit-learn pydantic pydantic-settings \
                      sqlalchemy tenacity pytest pytest-cov ruff

      - name: Lint
        run: ruff check backend tests scripts

      - name: Run tests
        run: pytest tests/ -o addopts="" --cov=backend --cov-report=term-missing
